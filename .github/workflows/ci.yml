name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: alsmun, POSTGRES_PASSWORD: alsmun, POSTGRES_DB: alsmun }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U alsmun -d alsmun" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://alsmun:alsmun@localhost:5432/alsmun
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-0123
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy && npm run db:seed -- --demo
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
